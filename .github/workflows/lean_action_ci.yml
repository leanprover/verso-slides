name: Lean Action CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

        steps:
            - uses: actions/checkout@v7.0.1

            - name: Verify every lean-toolchain file matches the root
              run: scripts/check-toolchains.sh

            - name: Install uv
              uses: astral-sh/setup-uv@v10.3.3
              with:
                  enable-cache: true
                  cache-dependency-glob: "browser-tests/pyproject.toml"

            - name: Cache Playwright browsers
              uses: actions/cache@v5.1.0
              with:
                  path: .playwright-browsers
                  key: playwright-${{ runner.os }}-${{ hashFiles('browser-tests/uv.lock') }}

            - uses: leanprover/lean-action@v1.7.1

            # The Lean build fetches the Illuminate package, and web-lib/animate/jsconfig.json
            # includes its anim_core.js and anim_data.d.ts from .lake/packages.
            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: "lts/*"
                  cache: npm

            - run: npm ci

            - name: Type check every jsconfig.json and tsconfig*.json
              run: |
                  status=0
                  while IFS= read -r -d '' config; do
                      echo "::group::$config"
                      npx --no-install tsc --noEmit -p "$config" || status=1
                      echo "::endgroup::"
                  done < <(git ls-files -z -- ':(glob)**/jsconfig.json' ':(glob)**/tsconfig*.json')
                  exit "$status"

    jsconfig-coverage:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7.0.1

            - name: Verify every .js under web-lib/ is in some jsconfig.json
              run: scripts/check-jsconfig-coverage.sh
